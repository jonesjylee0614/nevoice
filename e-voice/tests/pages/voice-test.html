<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>语音接口测试</title>
    <link rel="stylesheet" href="../components/common.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>语音接口测试</h1>
            <p>专门测试语音识别、注册和验证相关的API接口</p>
        </div>

        <div class="config-section">
            <h3>服务器配置</h3>
            <div class="input-group">
                <label for="serverUrl">服务器地址:</label>
                <select id="serverEnv" onchange="changeServerEnvironment()">
                    <option value="localhost">本地开发 (localhost:8210)</option>
                    <option value="wsl-localhost">WSL内部 (localhost:8210)</option>
                    <option value="wsl-host">WSL宿主机 (172.31.77.180:8210)</option>
                    <option value="wsl-bridge">WSL桥接 (127.0.0.1:8210)</option>
                    <option value="development">开发环境 (172.31.77.180:8210)</option>
                    <option value="production">生产环境 (127.0.0.1:8210)</option>
                    <option value="custom">自定义</option>
                </select>
                <input type="text" id="serverUrl" value="http://localhost:8210" placeholder="输入服务器地址">
                <button class="btn" onclick="checkServerStatus()">检查连接</button>
                <span id="serverStatus" class="status-indicator status-checking">未检查</span>
            </div>
        </div>

        <div class="main-content">
            <!-- 统一导航区域 - 自动生成 -->

            <!-- 语音注册接口 -->
            <div class="api-section">
                <div class="api-header">
                    <div class="api-title">
                        <span class="api-method method-post">POST</span>
                        语音注册接口
                    </div>
                    <div class="api-description">上传音频文件进行语音识别和注册，建立用户声纹模型</div>
                </div>
                <div class="api-body">
                    <div class="form-group">
                        <label for="username">用户名:</label>
                        <input type="text" id="username" value="test_user" placeholder="输入用户名">
                    </div>
                    <div class="form-group">
                        <label for="userid">用户ID:</label>
                        <input type="number" id="userid" value="123" placeholder="输入用户ID">
                    </div>
                    <div class="form-group">
                        <label for="audioFile">音频文件:</label>
                        <div class="file-input-wrapper">
                            <input type="file" id="audioFile" class="file-input" accept="audio/*" onchange="handleFileSelect(this, 'audioFileLabel')">
                            <label for="audioFile" class="file-input-label" id="audioFileLabel">
                                点击选择音频文件或拖拽文件到此处<br>
                                <small>支持 WAV, MP3, M4A 等格式</small>
                            </label>
                        </div>
                    </div>
                    <button class="btn" onclick="testVoiceRegister()">
                        <span id="voiceLoading" class="loading hidden"></span>
                        测试语音注册
                    </button>
                    <div id="voiceResponse" class="response-section hidden">
                        <div class="response-header">
                            <span id="voiceStatus" class="response-status"></span>
                            <span id="voiceTime" class="response-time"></span>
                        </div>
                        <div id="voiceContent" class="response-content"></div>
                    </div>
                </div>
            </div>

            <!-- 语音验证接口 (预留) -->
            <div class="api-section">
                <div class="api-header">
                    <div class="api-title">
                        <span class="api-method method-post">POST</span>
                        语音验证接口 (开发中)
                    </div>
                    <div class="api-description">验证用户语音是否匹配已注册的声纹</div>
                </div>
                <div class="api-body">
                    <div class="form-group">
                        <label for="verifyUserId">验证用户ID:</label>
                        <input type="number" id="verifyUserId" placeholder="输入要验证的用户ID">
                    </div>
                    <div class="form-group">
                        <label for="verifyAudioFile">音频文件:</label>
                        <div class="file-input-wrapper">
                            <input type="file" id="verifyAudioFile" class="file-input" accept="audio/*" onchange="handleFileSelect(this, 'verifyAudioFileLabel')">
                            <label for="verifyAudioFile" class="file-input-label" id="verifyAudioFileLabel">
                                点击选择音频文件或拖拽文件到此处<br>
                                <small>支持 WAV, MP3, M4A 等格式</small>
                            </label>
                        </div>
                    </div>
                    <button class="btn" onclick="testVoiceVerify()" disabled>
                        <span id="verifyLoading" class="loading hidden"></span>
                        测试语音验证 (功能开发中)
                    </button>
                    <div id="verifyResponse" class="response-section hidden">
                        <div class="response-header">
                            <span id="verifyStatus" class="response-status"></span>
                            <span id="verifyTime" class="response-time"></span>
                        </div>
                        <div id="verifyContent" class="response-content"></div>
                    </div>
                </div>
            </div>

            <!-- 批量语音测试 -->
            <div class="api-section">
                <div class="api-header">
                    <div class="api-title">
                        <span class="api-method method-get">批量</span>
                        批量语音测试
                    </div>
                    <div class="api-description">使用示例音频文件进行批量测试</div>
                </div>
                <div class="api-body">
                    <button class="btn" onclick="runVoiceBatchTest()">
                        <span id="batchLoading" class="loading hidden"></span>
                        运行批量语音测试
                    </button>
                    <button class="btn btn-danger" onclick="clearAllResults(['voiceResponse', 'verifyResponse', 'batchResults'])">清空所有结果</button>
                    <div id="batchResults" class="response-section hidden">
                        <div class="response-header">
                            <span class="response-status">批量测试结果</span>
                        </div>
                        <div id="batchContent" class="response-content"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="../components/config.js"></script>
    <script src="../components/common.js"></script>
    <script src="../components/navigation.js"></script>
    <script>
        // 环境切换
        function changeServerEnvironment() {
            const envSelect = document.getElementById('serverEnv');
            const urlInput = document.getElementById('serverUrl');
            
            const selectedEnv = envSelect.value;
            if (selectedEnv === 'custom') {
                urlInput.disabled = false;
                urlInput.focus();
            } else {
                urlInput.disabled = true;
                urlInput.value = Config.SERVER_OPTIONS[selectedEnv];
                updateServerUrl(urlInput.value);
            }
        }

        // 语音注册测试
        async function testVoiceRegister() {
            showLoading('voiceLoading');
            
            const username = document.getElementById('username').value.trim();
            const userid = document.getElementById('userid').value.trim();
            const audioFile = document.getElementById('audioFile').files[0];

            if (!username || !userid) {
                showResponse('voiceResponse', 'voiceStatus', 'voiceTime', 'voiceContent', 
                           400, 0, '用户名和用户ID不能为空');
                hideLoading('voiceLoading');
                return;
            }

            if (!audioFile) {
                showResponse('voiceResponse', 'voiceStatus', 'voiceTime', 'voiceContent', 
                           400, 0, '请选择音频文件');
                hideLoading('voiceLoading');
                return;
            }

            try {
                const formData = new FormData();
                formData.append('audio', audioFile);
                formData.append('username', username);
                formData.append('userid', userid);

                const startTime = Date.now();
                const response = await fetch(`${baseUrl}${Config.ENDPOINTS.VOICE_REGISTER}`, {
                    method: 'POST',
                    body: formData,
                    signal: AbortSignal.timeout(Config.TIMEOUT.FILE_UPLOAD)
                });
                const responseTime = Date.now() - startTime;
                
                const contentType = response.headers.get('content-type');
                let content;
                if (contentType && contentType.includes('application/json')) {
                    content = await response.json();
                } else {
                    content = await response.text();
                }

                showResponse('voiceResponse', 'voiceStatus', 'voiceTime', 'voiceContent', 
                           response.status, responseTime, content);
            } catch (error) {
                showResponse('voiceResponse', 'voiceStatus', 'voiceTime', 'voiceContent', 
                           0, 0, `网络错误: ${error.message}`);
            } finally {
                hideLoading('voiceLoading');
            }
        }

        // 语音验证测试 (预留功能)
        async function testVoiceVerify() {
            showLoading('verifyLoading');
            
            // 这里将来实现语音验证逻辑
            setTimeout(() => {
                showResponse('verifyResponse', 'verifyStatus', 'verifyTime', 'verifyContent', 
                           501, 0, '语音验证功能正在开发中，敬请期待');
                hideLoading('verifyLoading');
            }, 1000);
        }

        // 批量语音测试
        async function runVoiceBatchTest() {
            showLoading('batchLoading');
            
            const results = [];
            let allPassed = true;

            // 测试健康检查
            try {
                const response = await fetch(`${baseUrl}${Config.ENDPOINTS.HEALTH}`);
                const content = await response.text();
                const passed = response.ok && content === 'success';
                results.push(`✓ 健康检查: ${passed ? '通过' : '失败'} (${response.status})`);
                if (!passed) allPassed = false;
            } catch (error) {
                results.push(`✗ 健康检查: 失败 - ${error.message}`);
                allPassed = false;
            }

            // 测试语音注册接口可用性 (不传文件，只测试端点)
            try {
                const formData = new FormData();
                formData.append('username', 'test');
                formData.append('userid', '999');
                
                const response = await fetch(`${baseUrl}${Config.ENDPOINTS.VOICE_REGISTER}`, {
                    method: 'POST',
                    body: formData
                });
                
                // 期望400错误（因为没有音频文件），说明端点可用
                const passed = response.status === 400;
                results.push(`${passed ? '✓' : '✗'} 语音注册端点: ${passed ? '可用' : '不可用'} (${response.status})`);
                if (!passed) allPassed = false;
            } catch (error) {
                results.push(`✗ 语音注册端点: 失败 - ${error.message}`);
                allPassed = false;
            }

            const summary = `语音接口批量测试完成！\n总体结果: ${allPassed ? '✓ 全部通过' : '✗ 部分失败'}\n\n` + results.join('\n');
            
            document.getElementById('batchResults').classList.remove('hidden');
            document.getElementById('batchContent').textContent = summary;
            
            hideLoading('batchLoading');
        }

        // 页面初始化
        window.addEventListener('load', function() {
            // 设置拖拽上传
            setupDragAndDrop('audioFileLabel', 'audioFile');
            setupDragAndDrop('verifyAudioFileLabel', 'verifyAudioFile');
            
            // 初始化环境选择
            changeServerEnvironment();
        });
    </script>
</body>
</html>
