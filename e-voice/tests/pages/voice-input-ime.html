<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Voice 语音输入法 | 智能语音识别</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-color: #3b82f6;
            --primary-hover: #2563eb;
            --success-color: #10b981;
            --danger-color: #ef4444;
            --warning-color: #f59e0b;
            --text-primary: #1f2937;
            --text-secondary: #6b7280;
            --text-candidate: #3b82f6;
            --bg-primary: #ffffff;
            --bg-secondary: #f9fafb;
            --bg-hover: #f3f4f6;
            --border-color: #e5e7eb;
            --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
            --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1);
            --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1);
            --shadow-xl: 0 20px 25px -5px rgb(0 0 0 / 0.1);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 900px;
            background: var(--bg-primary);
            border-radius: 24px;
            box-shadow: var(--shadow-xl);
            overflow: hidden;
        }

        /* 头部 */
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 24px 32px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            font-size: 24px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .header-icon {
            width: 32px;
            height: 32px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }

        .status-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            font-size: 14px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--danger-color);
            animation: pulse 2s ease-in-out infinite;
        }

        .status-dot.connected {
            background: var(--success-color);
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        /* 主输入区域 */
        .input-area {
            padding: 32px;
            min-height: 400px;
            background: var(--bg-secondary);
        }

        .text-display {
            background: white;
            border: 2px solid var(--border-color);
            border-radius: 16px;
            padding: 24px;
            min-height: 350px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            box-shadow: var(--shadow-md);
            transition: border-color 0.3s ease;
        }

        .text-display.recording {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }

        .confirmed-text-section {
            flex: 1;
            min-height: 180px;
        }

        .section-label {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            color: var(--text-secondary);
            margin-bottom: 12px;
            letter-spacing: 0.5px;
        }

        .section-icon {
            width: 16px;
            height: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .confirmed-text {
            font-size: 18px;
            line-height: 1.8;
            color: var(--text-primary);
            white-space: pre-wrap;
            word-wrap: break-word;
            overflow-wrap: break-word;
        }

        .confirmed-text:empty::before {
            content: "等待语音输入...";
            color: var(--text-secondary);
            opacity: 0.5;
            font-style: italic;
        }

        .candidate-text-section {
            border-top: 2px dashed var(--border-color);
            padding-top: 16px;
            min-height: 80px;
        }

        .candidate-text {
            font-size: 16px;
            line-height: 1.6;
            color: var(--text-candidate);
            font-style: italic;
            animation: fadeIn 0.3s ease;
        }

        .candidate-text:empty::before {
            content: "实时识别结果将在此显示...";
            color: var(--text-secondary);
            opacity: 0.4;
            font-size: 14px;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* 纠错高亮动画 */
        .correction-highlight {
            background: linear-gradient(120deg, #fef3c7 0%, #fde68a 100%);
            padding: 2px 4px;
            border-radius: 4px;
            animation: highlightPulse 1.5s ease;
        }

        @keyframes highlightPulse {
            0%, 100% { background-color: transparent; }
            50% { background-color: #fef3c7; }
        }

        /* 控制面板 */
        .control-panel {
            padding: 24px 32px 32px;
            background: white;
            border-top: 1px solid var(--border-color);
        }

        .main-controls {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 24px;
            margin-bottom: 24px;
        }

        .record-button {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            border: none;
            background: linear-gradient(135deg, var(--primary-color), var(--primary-hover));
            color: white;
            font-size: 32px;
            cursor: pointer;
            box-shadow: var(--shadow-lg);
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .record-button:hover {
            transform: scale(1.05);
            box-shadow: var(--shadow-xl);
        }

        .record-button:active {
            transform: scale(0.95);
        }

        .record-button.recording {
            background: var(--danger-color);
            animation: recordPulse 1.5s ease-in-out infinite;
        }

        @keyframes recordPulse {
            0%, 100% {
                box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7);
            }
            50% {
                box-shadow: 0 0 0 20px rgba(239, 68, 68, 0);
            }
        }

        .record-button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* 声波动画 */
        .waveform {
            display: none;
            align-items: center;
            gap: 4px;
            height: 40px;
        }

        .waveform.active {
            display: flex;
        }

        .wave-bar {
            width: 4px;
            background: var(--primary-color);
            border-radius: 2px;
            animation: wave 1s ease-in-out infinite;
        }

        .wave-bar:nth-child(1) { animation-delay: 0s; height: 20px; }
        .wave-bar:nth-child(2) { animation-delay: 0.1s; height: 30px; }
        .wave-bar:nth-child(3) { animation-delay: 0.2s; height: 40px; }
        .wave-bar:nth-child(4) { animation-delay: 0.3s; height: 30px; }
        .wave-bar:nth-child(5) { animation-delay: 0.4s; height: 20px; }

        @keyframes wave {
            0%, 100% { height: 20px; }
            50% { height: 40px; }
        }

        /* 次要控制 */
        .secondary-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
        }

        .control-group {
            display: flex;
            gap: 12px;
        }

        .control-btn {
            padding: 10px 20px;
            border: 1px solid var(--border-color);
            background: white;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--text-primary);
        }

        .control-btn:hover {
            background: var(--bg-hover);
            border-color: var(--primary-color);
            color: var(--primary-color);
        }

        .control-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .control-btn.primary {
            background: var(--primary-color);
            color: white;
            border-color: var(--primary-color);
        }

        .control-btn.primary:hover {
            background: var(--primary-hover);
        }

        .stats-display {
            display: flex;
            gap: 24px;
            font-size: 14px;
            color: var(--text-secondary);
        }

        .stat-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .stat-value {
            font-weight: 600;
            color: var(--text-primary);
        }

        /* 设置面板 */
        .settings-panel {
            padding: 24px 32px;
            background: var(--bg-secondary);
            border-top: 1px solid var(--border-color);
            display: none;
        }

        .settings-panel.open {
            display: block;
            animation: slideDown 0.3s ease;
        }

        @keyframes slideDown {
            from { opacity: 0; max-height: 0; }
            to { opacity: 1; max-height: 500px; }
        }

        .settings-group {
            margin-bottom: 20px;
        }

        .settings-group:last-child {
            margin-bottom: 0;
        }

        .settings-label {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 12px;
            display: block;
        }

        .settings-input {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 14px;
            background: white;
        }

        .settings-input:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }

        .checkbox-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .checkbox-item {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .checkbox-item input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        .checkbox-item label {
            font-size: 14px;
            color: var(--text-primary);
            cursor: pointer;
        }

        /* 纠错记录面板 */
        .correction-history {
            padding: 24px 32px;
            background: white;
            border-top: 1px solid var(--border-color);
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease;
        }

        .correction-history.open {
            max-height: 400px;
            overflow-y: auto;
        }

        .correction-item {
            padding: 12px;
            background: var(--bg-secondary);
            border-radius: 8px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 14px;
        }

        .correction-item:last-child {
            margin-bottom: 0;
        }

        .correction-arrow {
            color: var(--text-secondary);
            font-weight: bold;
        }

        .correction-original {
            color: var(--text-secondary);
            text-decoration: line-through;
        }

        .correction-fixed {
            color: var(--success-color);
            font-weight: 600;
        }

        /* 提示信息 */
        .toast {
            position: fixed;
            bottom: 24px;
            right: 24px;
            background: white;
            padding: 16px 24px;
            border-radius: 12px;
            box-shadow: var(--shadow-xl);
            display: none;
            align-items: center;
            gap: 12px;
            animation: slideIn 0.3s ease;
            z-index: 1000;
        }

        .toast.show {
            display: flex;
        }

        @keyframes slideIn {
            from { transform: translateX(400px); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        .toast-icon {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
        }

        .toast.success .toast-icon {
            background: var(--success-color);
            color: white;
        }

        .toast.error .toast-icon {
            background: var(--danger-color);
            color: white;
        }

        .toast.info .toast-icon {
            background: var(--primary-color);
            color: white;
        }

        /* 响应式 */
        @media (max-width: 768px) {
            .container {
                border-radius: 0;
            }

            .header {
                flex-direction: column;
                gap: 16px;
                text-align: center;
            }

            .input-area {
                padding: 20px;
            }

            .control-panel {
                padding: 20px;
            }

            .secondary-controls {
                flex-direction: column;
            }

            .stats-display {
                width: 100%;
                justify-content: space-around;
            }
        }

        /* 快捷键提示 */
        .keyboard-hint {
            position: fixed;
            bottom: 24px;
            left: 24px;
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 12px 20px;
            border-radius: 8px;
            font-size: 13px;
            opacity: 0;
            transition: opacity 0.3s ease;
            pointer-events: none;
        }

        .keyboard-hint.show {
            opacity: 1;
        }

        .kbd {
            display: inline-block;
            padding: 3px 8px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 4px;
            font-family: monospace;
            font-size: 12px;
            margin: 0 4px;
        }
    </style>
</head>
<body>
    <!-- 主容器 -->
    <div class="container">
        <!-- 头部 -->
        <div class="header">
            <h1>
                <div class="header-icon">🎤</div>
                E-Voice 语音输入法
            </h1>
            <div class="status-badge">
                <div class="status-dot" id="statusDot"></div>
                <span id="statusText">未连接</span>
            </div>
        </div>

        <!-- 主输入区域 -->
        <div class="input-area">
            <div class="text-display" id="textDisplay">
                <!-- 确认文本区域 -->
                <div class="confirmed-text-section">
                    <div class="section-label">
                        <span class="section-icon">✓</span>
                        确认文本
                    </div>
                    <div class="confirmed-text" id="confirmedText"></div>
                </div>

                <!-- 候选文本区域 -->
                <div class="candidate-text-section">
                    <div class="section-label">
                        <span class="section-icon">⚡</span>
                        实时识别
                    </div>
                    <div class="candidate-text" id="candidateText"></div>
                </div>
            </div>
        </div>

        <!-- 控制面板 -->
        <div class="control-panel">
            <!-- 主要控制 -->
            <div class="main-controls">
                <div class="waveform" id="waveform">
                    <div class="wave-bar"></div>
                    <div class="wave-bar"></div>
                    <div class="wave-bar"></div>
                    <div class="wave-bar"></div>
                    <div class="wave-bar"></div>
                </div>

                <button class="record-button" id="recordBtn" title="点击开始录音 或 按住空格键">
                    <span id="recordIcon">🎤</span>
                </button>

                <div class="waveform" id="waveform2">
                    <div class="wave-bar"></div>
                    <div class="wave-bar"></div>
                    <div class="wave-bar"></div>
                    <div class="wave-bar"></div>
                    <div class="wave-bar"></div>
                </div>
            </div>

            <!-- 次要控制 -->
            <div class="secondary-controls">
                <div class="control-group">
                    <button class="control-btn primary" id="copyBtn" title="复制全部文本 (Ctrl+C)">
                        📋 复制
                    </button>
                    <button class="control-btn" id="clearBtn" title="清除全部文本">
                        🗑️ 清除
                    </button>
                    <button class="control-btn" id="settingsBtn" title="设置">
                        ⚙️ 设置
                    </button>
                </div>

                <div class="stats-display">
                    <div class="stat-item">
                        <span>⏱️</span>
                        <span class="stat-value" id="timerDisplay">00:00</span>
                    </div>
                    <div class="stat-item">
                        <span>📝</span>
                        <span class="stat-value" id="sentenceCount">0 句</span>
                    </div>
                    <div class="stat-item">
                        <span>✨</span>
                        <span class="stat-value" id="correctionCount">0 次纠错</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- 设置面板 -->
        <div class="settings-panel" id="settingsPanel">
            <div class="settings-group">
                <label class="settings-label">服务器地址</label>
                <input type="text" class="settings-input" id="serverUrl" value="ws://localhost:8210/ws/recognize" placeholder="输入WebSocket地址">
            </div>

            <div class="settings-group">
                <label class="settings-label">识别选项</label>
                <div class="checkbox-group">
                    <div class="checkbox-item">
                        <input type="checkbox" id="optAutoCorrection" checked>
                        <label for="optAutoCorrection">启用智能纠错</label>
                    </div>
                    <div class="checkbox-item">
                        <input type="checkbox" id="optShowPartial" checked>
                        <label for="optShowPartial">显示实时识别</label>
                    </div>
                    <div class="checkbox-item">
                        <input type="checkbox" id="optAutoPunctuation" checked>
                        <label for="optAutoPunctuation">自动标点符号</label>
                    </div>
                    <div class="checkbox-item">
                        <input type="checkbox" id="optShowCorrections" checked>
                        <label for="optShowCorrections">显示纠错记录</label>
                    </div>
                    <div class="checkbox-item">
                        <input type="checkbox" id="optSpaceKeyShortcut" checked>
                        <label for="optSpaceKeyShortcut">启用空格键快捷操作</label>
                    </div>
                </div>
            </div>

            <div class="settings-group">
                <button class="control-btn primary" onclick="saveSettings()">💾 保存设置</button>
                <button class="control-btn" onclick="resetSettings()">🔄 恢复默认</button>
            </div>
        </div>

        <!-- 纠错记录面板 -->
        <div class="correction-history" id="correctionHistory">
            <h3 style="margin-bottom: 16px; color: var(--text-primary); font-size: 16px;">纠错记录</h3>
            <div id="correctionList">
                <div style="text-align: center; color: var(--text-secondary); padding: 20px;">
                    暂无纠错记录
                </div>
            </div>
        </div>
    </div>

    <!-- 提示信息 -->
    <div class="toast" id="toast">
        <div class="toast-icon">✓</div>
        <span id="toastMessage">操作成功</span>
    </div>

    <!-- 快捷键提示 -->
    <div class="keyboard-hint" id="keyboardHint">
        <kbd class="kbd">Space</kbd> 按住录音 · <kbd class="kbd">Ctrl+C</kbd> 复制文本
    </div>

    <script>
        // 全局变量
        let websocket = null;
        let audioContext = null;
        let mediaStream = null;
        let scriptProcessor = null;
        let isRecording = false;
        let isConnected = false;
        let recordingTimer = null;
        let recordingStartTime = 0;
        let audioBuffer = [];

        // 状态数据
        let confirmedTexts = [];
        let candidateText = '';
        let correctionHistory = [];
        let sentenceCount = 0;
        let lastRevision = 0;

        // 音频配置
        const SAMPLE_RATE = 16000;
        const CHUNK_SIZE = 9600; // 600ms @ 16kHz

        // DOM元素
        const elements = {
            statusDot: document.getElementById('statusDot'),
            statusText: document.getElementById('statusText'),
            textDisplay: document.getElementById('textDisplay'),
            confirmedText: document.getElementById('confirmedText'),
            candidateText: document.getElementById('candidateText'),
            recordBtn: document.getElementById('recordBtn'),
            recordIcon: document.getElementById('recordIcon'),
            waveform: document.getElementById('waveform'),
            waveform2: document.getElementById('waveform2'),
            copyBtn: document.getElementById('copyBtn'),
            clearBtn: document.getElementById('clearBtn'),
            settingsBtn: document.getElementById('settingsBtn'),
            settingsPanel: document.getElementById('settingsPanel'),
            timerDisplay: document.getElementById('timerDisplay'),
            sentenceCount: document.getElementById('sentenceCount'),
            correctionCount: document.getElementById('correctionCount'),
            serverUrl: document.getElementById('serverUrl'),
            correctionHistory: document.getElementById('correctionHistory'),
            correctionList: document.getElementById('correctionList'),
            toast: document.getElementById('toast'),
            toastMessage: document.getElementById('toastMessage'),
            keyboardHint: document.getElementById('keyboardHint')
        };

        // 初始化
        function init() {
            loadSettings();
            bindEvents();
            connectWebSocket();
            showKeyboardHint();
        }

        // 显示快捷键提示
        function showKeyboardHint() {
            setTimeout(() => {
                elements.keyboardHint.classList.add('show');
                setTimeout(() => {
                    elements.keyboardHint.classList.remove('show');
                }, 5000);
            }, 1000);
        }

        // 绑定事件
        function bindEvents() {
            // 录音按钮
            elements.recordBtn.addEventListener('click', toggleRecording);

            // 复制按钮
            elements.copyBtn.addEventListener('click', copyText);

            // 清除按钮
            elements.clearBtn.addEventListener('click', clearText);

            // 设置按钮
            elements.settingsBtn.addEventListener('click', toggleSettings);

            // 键盘快捷键
            document.addEventListener('keydown', handleKeyDown);
            document.addEventListener('keyup', handleKeyUp);

            // 页面卸载时断开连接
            window.addEventListener('beforeunload', cleanup);
        }

        // 键盘事件处理
        let spaceKeyPressed = false;

        function handleKeyDown(e) {
            // 空格键录音
            if (e.code === 'Space' && !e.repeat && document.getElementById('optSpaceKeyShortcut').checked) {
                if (document.activeElement.tagName !== 'INPUT' && document.activeElement.tagName !== 'TEXTAREA') {
                    e.preventDefault();
                    if (!spaceKeyPressed && !isRecording) {
                        spaceKeyPressed = true;
                        startRecording();
                    }
                }
            }

            // Ctrl+C 复制
            if (e.ctrlKey && e.code === 'KeyC') {
                if (document.activeElement !== elements.confirmedText) {
                    e.preventDefault();
                    copyText();
                }
            }
        }

        function handleKeyUp(e) {
            // 空格键松开停止录音
            if (e.code === 'Space' && document.getElementById('optSpaceKeyShortcut').checked) {
                if (spaceKeyPressed && isRecording) {
                    spaceKeyPressed = false;
                    stopRecording();
                }
            }
        }

        // WebSocket连接
        function connectWebSocket() {
            const wsUrl = elements.serverUrl.value;

            try {
                websocket = new WebSocket(wsUrl);
                websocket.binaryType = 'arraybuffer';

                websocket.onopen = () => {
                    isConnected = true;
                    updateStatus('connected', '已连接');
                    elements.recordBtn.disabled = false;
                    showToast('success', '已连接到服务器');
                };

                websocket.onmessage = (event) => {
                    try {
                        const data = JSON.parse(event.data);
                        handleMessage(data);
                    } catch (error) {
                        console.error('消息解析失败:', error);
                    }
                };

                websocket.onerror = (error) => {
                    console.error('WebSocket错误:', error);
                    showToast('error', '连接错误');
                };

                websocket.onclose = () => {
                    isConnected = false;
                    updateStatus('disconnected', '未连接');
                    elements.recordBtn.disabled = true;
                    if (isRecording) {
                        stopRecording();
                    }
                    // 5秒后重连
                    setTimeout(connectWebSocket, 5000);
                };
            } catch (error) {
                console.error('连接失败:', error);
                showToast('error', '连接失败: ' + error.message);
            }
        }

        // 更新连接状态
        function updateStatus(status, text) {
            elements.statusDot.className = 'status-dot' + (status === 'connected' ? ' connected' : '');
            elements.statusText.textContent = text;
        }

        // 处理WebSocket消息
        function handleMessage(data) {
            const type = data.type;

            switch (type) {
                case 'partial':
                    if (document.getElementById('optShowPartial').checked) {
                        handlePartial(data);
                    }
                    break;

                case 'final':
                case 'correction':
                    handleFinal(data);
                    break;

                case 'error':
                    showToast('error', data.message || '识别错误');
                    break;

                default:
                    console.log('收到消息:', data);
            }
        }

        // 处理实时识别结果
        function handlePartial(data) {
            const state = data.text_state || {};
            const revision = state.revision_id || 0;

            // 时序校验
            if (revision < lastRevision) {
                console.warn('丢弃过期事件:', revision, '<', lastRevision);
                return;
            }
            lastRevision = revision;

            // 更新候选文本
            candidateText = state.candidate_text || data.text || '';
            elements.candidateText.textContent = candidateText;

            // 如果有确认文本更新
            if (state.confirmed_text && state.confirmed_text !== confirmedTexts.join(' ')) {
                updateConfirmedText(state.confirmed_text);
            }
        }

        // 处理最终结果
        function handleFinal(data) {
            const text = data.text || '';
            if (!text.trim()) return;

            const state = data.text_state || {};
            const revision = state.revision_id || 0;

            // 时序校验
            if (revision < lastRevision) {
                console.warn('丢弃过期事件:', revision, '<', lastRevision);
                return;
            }
            lastRevision = revision;

            // 检查是否是纠错
            const isCorrection = data.type === 'correction';
            const originalText = data.raw_text || data.original_text || '';

            if (isCorrection && originalText) {
                // 记录纠错
                addCorrectionRecord(originalText, text);
                highlightCorrection(text);
            }

            // 更新确认文本
            updateConfirmedText(text);

            // 清空候选文本
            candidateText = '';
            elements.candidateText.textContent = '';

            // 更新统计
            sentenceCount++;
            elements.sentenceCount.textContent = sentenceCount + ' 句';
        }

        // 更新确认文本
        function updateConfirmedText(text) {
            confirmedTexts = text.split('\n').filter(t => t.trim());
            elements.confirmedText.textContent = confirmedTexts.join('\n');
        }

        // 添加纠错记录
        function addCorrectionRecord(original, corrected) {
            if (!document.getElementById('optShowCorrections').checked) return;

            correctionHistory.unshift({
                original,
                corrected,
                timestamp: new Date().toLocaleTimeString()
            });

            // 限制最多20条
            if (correctionHistory.length > 20) {
                correctionHistory = correctionHistory.slice(0, 20);
            }

            // 更新显示
            updateCorrectionHistory();
            elements.correctionCount.textContent = correctionHistory.length + ' 次纠错';

            // 展开纠错面板
            elements.correctionHistory.classList.add('open');
        }

        // 更新纠错记录显示
        function updateCorrectionHistory() {
            if (correctionHistory.length === 0) {
                elements.correctionList.innerHTML = `
                    <div style="text-align: center; color: var(--text-secondary); padding: 20px;">
                        暂无纠错记录
                    </div>
                `;
                return;
            }

            elements.correctionList.innerHTML = correctionHistory.map(item => `
                <div class="correction-item">
                    <span style="color: var(--text-secondary); font-size: 12px;">${item.timestamp}</span>
                    <span class="correction-original">${item.original}</span>
                    <span class="correction-arrow">→</span>
                    <span class="correction-fixed">${item.corrected}</span>
                </div>
            `).join('');
        }

        // 纠错高亮动画
        function highlightCorrection(text) {
            const words = text.split('');
            elements.confirmedText.innerHTML = words.map(char =>
                `<span class="correction-highlight">${char}</span>`
            ).join('');

            // 2秒后移除高亮
            setTimeout(() => {
                elements.confirmedText.textContent = text;
            }, 2000);
        }

        // 切换录音状态
        function toggleRecording() {
            if (isRecording) {
                stopRecording();
            } else {
                startRecording();
            }
        }

        // 开始录音
        async function startRecording() {
            if (!isConnected) {
                showToast('error', '请先连接到服务器');
                return;
            }

            if (isRecording) return;

            try {
                // 获取麦克风权限
                mediaStream = await navigator.mediaDevices.getUserMedia({
                    audio: {
                        sampleRate: SAMPLE_RATE,
                        channelCount: 1,
                        echoCancellation: true,
                        noiseSuppression: true,
                        autoGainControl: true
                    }
                });

                // 创建音频处理链
                audioContext = new (window.AudioContext || window.webkitAudioContext)({
                    sampleRate: SAMPLE_RATE
                });

                const source = audioContext.createMediaStreamSource(mediaStream);
                scriptProcessor = audioContext.createScriptProcessor(4096, 1, 1);
                scriptProcessor.onaudioprocess = processAudio;

                source.connect(scriptProcessor);
                scriptProcessor.connect(audioContext.destination);

                // 发送开始消息
                websocket.send(JSON.stringify({
                    type: 'start',
                    enable_correction: document.getElementById('optAutoCorrection').checked,
                    enable_itn: document.getElementById('optAutoPunctuation').checked,
                    enable_partial: document.getElementById('optShowPartial').checked
                }));

                // 更新UI
                isRecording = true;
                elements.recordBtn.classList.add('recording');
                elements.recordIcon.textContent = '⏹️';
                elements.textDisplay.classList.add('recording');
                elements.waveform.classList.add('active');
                elements.waveform2.classList.add('active');

                // 启动计时器
                recordingStartTime = Date.now();
                recordingTimer = setInterval(updateTimer, 1000);

                showToast('info', '开始录音');
            } catch (error) {
                console.error('录音启动失败:', error);
                showToast('error', '无法访问麦克风: ' + error.message);
                cleanup();
            }
        }

        // 停止录音
        function stopRecording() {
            if (!isRecording) return;

            // 发送结束消息
            if (websocket && websocket.readyState === WebSocket.OPEN) {
                websocket.send(JSON.stringify({ type: 'end' }));
            }

            // 清理资源
            if (scriptProcessor) {
                scriptProcessor.disconnect();
                scriptProcessor.onaudioprocess = null;
                scriptProcessor = null;
            }

            if (audioContext) {
                audioContext.close().catch(console.error);
                audioContext = null;
            }

            if (mediaStream) {
                mediaStream.getTracks().forEach(track => track.stop());
                mediaStream = null;
            }

            // 停止计时器
            if (recordingTimer) {
                clearInterval(recordingTimer);
                recordingTimer = null;
            }

            // 更新UI
            isRecording = false;
            elements.recordBtn.classList.remove('recording');
            elements.recordIcon.textContent = '🎤';
            elements.textDisplay.classList.remove('recording');
            elements.waveform.classList.remove('active');
            elements.waveform2.classList.remove('active');
            elements.timerDisplay.textContent = '00:00';

            audioBuffer = [];

            showToast('info', '停止录音');
        }

        // 处理音频数据
        function processAudio(event) {
            if (!isRecording || !websocket || websocket.readyState !== WebSocket.OPEN) {
                return;
            }

            const input = event.inputBuffer.getChannelData(0);
            audioBuffer.push(...input);

            // 当累积到CHUNK_SIZE时发送
            while (audioBuffer.length >= CHUNK_SIZE) {
                const chunk = audioBuffer.slice(0, CHUNK_SIZE);
                audioBuffer = audioBuffer.slice(CHUNK_SIZE);

                // 转换为Int16 PCM
                const pcm = new Int16Array(chunk.length);
                for (let i = 0; i < chunk.length; i++) {
                    const s = Math.max(-1, Math.min(1, chunk[i]));
                    pcm[i] = s < 0 ? s * 0x8000 : s * 0x7fff;
                }

                // 转换为ArrayBuffer
                const buffer = new ArrayBuffer(pcm.length * 2);
                const view = new DataView(buffer);
                for (let i = 0; i < pcm.length; i++) {
                    view.setInt16(i * 2, pcm[i], true);
                }

                // Base64编码
                const bytes = new Uint8Array(buffer);
                const base64 = btoa(String.fromCharCode.apply(null, bytes));

                // 发送音频数据
                try {
                    websocket.send(JSON.stringify({
                        type: 'chunk',
                        format: 'pcm',
                        sample_rate: SAMPLE_RATE,
                        audio: base64
                    }));
                } catch (error) {
                    console.error('发送音频失败:', error);
                    stopRecording();
                }
            }
        }

        // 更新计时器
        function updateTimer() {
            const elapsed = Math.floor((Date.now() - recordingStartTime) / 1000);
            const minutes = Math.floor(elapsed / 60);
            const seconds = elapsed % 60;
            elements.timerDisplay.textContent =
                `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
        }

        // 复制文本
        function copyText() {
            const text = confirmedTexts.join('\n');
            if (!text) {
                showToast('info', '没有文本可复制');
                return;
            }

            navigator.clipboard.writeText(text).then(() => {
                showToast('success', '已复制到剪贴板');
            }).catch(err => {
                console.error('复制失败:', err);
                showToast('error', '复制失败');
            });
        }

        // 清除文本
        function clearText() {
            if (isRecording) {
                showToast('error', '请先停止录音');
                return;
            }

            confirmedTexts = [];
            candidateText = '';
            correctionHistory = [];
            sentenceCount = 0;
            lastRevision = 0;

            elements.confirmedText.textContent = '';
            elements.candidateText.textContent = '';
            elements.sentenceCount.textContent = '0 句';
            elements.correctionCount.textContent = '0 次纠错';
            elements.correctionHistory.classList.remove('open');

            updateCorrectionHistory();
            showToast('info', '已清除全部内容');
        }

        // 切换设置面板
        function toggleSettings() {
            elements.settingsPanel.classList.toggle('open');
        }

        // 保存设置
        function saveSettings() {
            const settings = {
                serverUrl: elements.serverUrl.value,
                autoCorrection: document.getElementById('optAutoCorrection').checked,
                showPartial: document.getElementById('optShowPartial').checked,
                autoPunctuation: document.getElementById('optAutoPunctuation').checked,
                showCorrections: document.getElementById('optShowCorrections').checked,
                spaceKeyShortcut: document.getElementById('optSpaceKeyShortcut').checked
            };

            localStorage.setItem('voiceInputSettings', JSON.stringify(settings));
            showToast('success', '设置已保存');

            // 如果服务器地址变了，重新连接
            const oldUrl = websocket?.url;
            const newUrl = elements.serverUrl.value;
            if (oldUrl !== newUrl) {
                if (websocket) {
                    websocket.close();
                }
                connectWebSocket();
            }
        }

        // 加载设置
        function loadSettings() {
            const saved = localStorage.getItem('voiceInputSettings');
            if (saved) {
                try {
                    const settings = JSON.parse(saved);
                    elements.serverUrl.value = settings.serverUrl || 'ws://localhost:8210/ws/recognize';
                    document.getElementById('optAutoCorrection').checked = settings.autoCorrection !== false;
                    document.getElementById('optShowPartial').checked = settings.showPartial !== false;
                    document.getElementById('optAutoPunctuation').checked = settings.autoPunctuation !== false;
                    document.getElementById('optShowCorrections').checked = settings.showCorrections !== false;
                    document.getElementById('optSpaceKeyShortcut').checked = settings.spaceKeyShortcut !== false;
                } catch (error) {
                    console.error('加载设置失败:', error);
                }
            }
        }

        // 恢复默认设置
        function resetSettings() {
            localStorage.removeItem('voiceInputSettings');
            elements.serverUrl.value = 'ws://localhost:8210/ws/recognize';
            document.getElementById('optAutoCorrection').checked = true;
            document.getElementById('optShowPartial').checked = true;
            document.getElementById('optAutoPunctuation').checked = true;
            document.getElementById('optShowCorrections').checked = true;
            document.getElementById('optSpaceKeyShortcut').checked = true;
            showToast('info', '已恢复默认设置');
        }

        // 显示提示信息
        function showToast(type, message) {
            elements.toast.className = 'toast show ' + type;
            elements.toastMessage.textContent = message;

            setTimeout(() => {
                elements.toast.classList.remove('show');
            }, 3000);
        }

        // 清理资源
        function cleanup() {
            if (isRecording) {
                stopRecording();
            }
            if (websocket) {
                websocket.close();
            }
        }

        // 页面加载完成后初始化
        window.addEventListener('load', init);
    </script>
</body>
</html>
