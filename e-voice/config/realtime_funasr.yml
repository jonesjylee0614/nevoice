# FunASR 实时识别配置
# 基于 FunASR/runtime/python/websocket/funasr_wss_server.py 验证的参数

mode:
  default: "2pass"  # 可选: 2pass, online, offline

audio:
  sample_rate: 16000
  # 🚀 性能优化：从15增加到20，减少在线ASR调用频率约25%
  # 原来：每900ms调用一次在线ASR -> 现在：每1200ms调用一次
  # 配合方案B降低调用频率，减轻GPU负担
  chunk_interval: 20  # 每 chunk_interval 个 chunk 发送一次在线识别请求
  chunk_size: [5, 10, 5]  # encoder_chunk_look_back, chunk_size, decoder_chunk_look_back (FunASR官方默认)

timeouts:
  idle_audio_timeout_ms: 5000
  grace_period_ms: 200
  max_session_ms: 300000

models:
  # 离线 ASR 模型（用于二次纠错）
  asr:
    model: "damo/speech_paraformer-large_asr_nat-zh-cn-16k-common-vocab8404-pytorch"
    local_path: null  # 设置后将使用本地路径，跳过网络检查
    revision: null
  # 在线流式 ASR 模型
  asr_online:
    model: "damo/speech_paraformer-large_asr_nat-zh-cn-16k-common-vocab8404-online"
    local_path: null
    revision: null
  # VAD 模型
  vad:
    model: "damo/speech_fsmn_vad_zh-cn-16k-common-pytorch"
    local_path: null
    revision: null
  # 标点模型
  punc:
    model: "damo/punc_ct-transformer_zh-cn-common-vad_realtime-vocab272727"
    local_path: null
    revision: null

# VAD 分段参数配置
vad:
  # 单个语音段的最大时长 (毫秒)，超过此时长会强制分段
  # 默认 60000ms = 60秒，适当调小避免单段过长
  max_single_segment_time: 25000  # 25秒
  
  # 句末静音时长阈值 (毫秒)，静音超过此时长则认为语音结束
  # 默认 800ms，调大让分段更稳定（避免中间停顿被误判为句末）
  # 🎯 从 1000ms 增加到 1500ms，减少过度切段，合并更多连续语音
  max_end_silence_time: 1500  # 1.5秒
  
  # 语音vs噪声阈值，范围 (-1, 1)
  # 值越大越严格（需要更明显的语音才会识别为说话）
  # 值越小越敏感（轻微声音也会被识别为说话）
  # 🎯 从 0.7 提高到 0.85，更严格过滤背景杂音
  speech_noise_thres: 0.85  # 更严格，避免环境噪音被识别为语音

# ITN (逆文本归一化) 配置
itn:
  enabled: true
  language: "zh"
  cache_dir: null  # null 表示使用默认目录 ./itn_cache

resources:
  ngpu: 1  # 0 表示 CPU, 1 表示 GPU
  ncpu: 4
  device: "cuda"  # cuda, cpu, auto

# 特性开关
features:
  # 启用 FunASR 流式引擎 (设为 false 可回退到旧引擎)
  use_funasr_streamer: true
  # 启用标点
  enable_punc: true
  # 启用 ITN
  enable_itn: true
  # 启用 VAD - 必须启用才能正确分段和计算时间偏移
  enable_vad: true
  # 调试模式 - 输出更多日志（排查延迟问题时建议开启）
  # 短期优化：关闭调试模式减少日志I/O开销
  debug: false
  # 🚀 离线纠正异步化：在线结果立即返回，离线纠正在后台执行
  # 这样实时识别不会被离线纠正阻塞，大幅降低延迟
  async_offline_correction: true
  # 🚀 在线 ASR 异步化：在线识别也放到线程池执行，不阻塞主处理循环
  # 这是方案C的核心优化，进一步降低延迟
  async_online_asr: true

